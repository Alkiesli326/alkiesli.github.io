<main id="contact">
    <h2>Contact Cupcakes by Amie</h2>

    <p>
        Have an idea for a special cupcake or an upcoming celebration?
        Send me an inquiry using the form below.
    </p>

        <form action="#" method="post">

            <label for="name">Name:</label>
            <input type="text" id="name" name="name">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">

            <label for="date">Date Needed:</label>
            <input type="date" id="date" name="date">

            <label for="occasion">Type of Occasion:</label>
            <input type="text" id="occasion" name="occasion">

            <label for="message">Tell me about your cupcake idea:</label>
            <textarea id="message" name="message" rows="5" cols="40"></textarea>

            <input type="submit" value="Submit Inquiry">

        </form>
</main>
